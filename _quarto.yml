project:
  type: website
  execute-dir: project
  render:
    - "*.qmd"
    - "chapters/**/*.qmd"
    - "ko/**/*.qmd"
  resources:
    - _extensions/ai-chat/ai-chat.js

website:
  favicon: assets/img/favicon.ico
  page-navigation: true
  navbar:
    logo: assets/img/logo.jpg
    left:
      - href: index.qmd
        text: Home
      - href: chapters/part1/W1_intro.qmd
        text: 1. Intro and R Basics
      - href: chapters/part2/W5_QC.qmd
        text: 2. DEG analysis
      - href: chapters/part3/W8_DEG Results Processing.qmd
        text: 3. Result interpretation
      - href: chapters/part4/W11_Rscript_vibe_coding.qmd
        text: 4. Practice and wrap-up
    # EN/KO 캡슐은 assets/lang-switch.js 가 navbar 오른쪽에 삽입하고,
    # Quarto 기본 테마 토글(.quarto-color-scheme-toggle)을 그 옆의 원형 버튼으로 재배치합니다.

  sidebar:
    # ── EN (원본) ──
    - id: en
      style: "floating"
      search: true
      contents:
        - text: "Home"
          href: index.qmd
        - section: "1. R basics"
          contents: chapters/part1/*.qmd
        - section: "2. DEG analysis"
          contents: chapters/part2/*.qmd
        - section: "3. Result interpretation"
          contents:
            - chapters/part3/W8_DEG Results Processing.qmd
            - chapters/part3/W9_ORA.qmd
            - chapters/part3/W10_GSEA.qmd
        - section: "4. Practice and wrap-up"
          contents: chapters/part4/*.qmd
    # ── KO (번역 완료 페이지만 등록: 번역이 끝난 주차를 여기에 순서대로 추가) ──
    - id: ko
      style: "floating"
      search: true
      contents:
        - text: "홈"
          href: ko/index.qmd
        - section: "1. R 기초"
          contents:
            - ko/chapters/part1/W1_intro.qmd
            - ko/chapters/part1/W2_rbasics.qmd
            - ko/chapters/part1/W3_wrangling.qmd
            - ko/chapters/part1/W4_publicdb.qmd
        - section: "2. DEG 분석"
          contents:
            - ko/chapters/part2/W5_QC.qmd
            - ko/chapters/part2/W6_EDA.qmd
            - ko/chapters/part2/W7_DEG Analysis.qmd
        - section: "3. 결과 해석"
          contents:
            - ko/chapters/part3/W8_DEG Results Processing.qmd
            - ko/chapters/part3/W9_ORA.qmd
            - ko/chapters/part3/W10_GSEA.qmd
        - section: "4. 실습과 마무리"
          contents:
            - ko/chapters/part4/W11_Rscript_vibe_coding.qmd
            - ko/chapters/part4/W12_summary.qmd

  page-footer:
    left: "Copyright 2026, Eunji"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: assets/html.css
    include-in-header: assets/lang-switch.html
    toc: true
    toc-depth: 4
    toc-title: "Contents"
    toc-float: true
    page-layout: full

    code-fold: false  
    code-copy: true
    highlight-style: github 

    number-sections: false
    smooth-scroll: true

    grid:                       
      sidebar-width: 350px
      body-width: 1000px
      margin-width: 250px # toc

    # AI 채팅 위젯 전역 설정
    include-after-body: assets/ai-chat-init.html

  revealjs:
    css: assets/revealjs.css    # 슬라이드용
    scrollable: true

execute:
  freeze: true          # CI에서 R 없이 렌더: 항상 _freeze 캐시 사용 (재실행 안 함)
  echo: true
  eval: false
  warning: false
  message: false
