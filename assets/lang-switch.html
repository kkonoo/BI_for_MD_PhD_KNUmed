<!-- EN/KO 언어 캡슐 + 원형 테마 버튼 (모든 HTML 페이지 <head>에 삽입; _quarto.yml include-in-header) -->
<style>
  /* ── 공통 색 변수 (라이트/다크 공통, 캡슐은 항상 짙은 남청색 유지) ── */
  :root {
    --ctl-surface: #1d384a;
    --ctl-active: #78d0cf;
    --ctl-inactive: #b7c9d6;
    --ctl-border: rgba(120, 208, 207, 0.12);
  }

  /* Quarto navbar-container는 order 값으로 배치한다
     (brand=2, collapse=20, tools/search=900). 검색 아이콘 바로 왼쪽에 둔다. */
  .site-controls {
    display: flex; align-items: center; gap: 12px;
    order: 899; margin-left: auto; margin-right: 10px;
  }

  /* ── EN/KO 캡슐 ── */
  .lang-switch {
    display: inline-flex; align-items: center;
    height: 46px; padding: 3px; border-radius: 999px;
    background: var(--ctl-surface);
    border: 1px solid var(--ctl-border);
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
  }
  .lang-switch a {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 38px; height: 38px; padding: 0 12px;
    border-radius: 999px;
    font-size: 15px; font-weight: 700; letter-spacing: .02em;
    color: var(--ctl-inactive) !important;
    text-decoration: none !important; line-height: 1;
    transition: background .15s, color .15s;
  }
  .lang-switch a:hover { color: #fff !important; }
  .lang-switch a.active {
    background: var(--ctl-active); color: #fff !important;
  }
  .lang-switch a.pending { opacity: .6; }
  .lang-switch a:focus-visible,
  .navbar .quarto-color-scheme-toggle.theme-circle:focus-visible {
    outline: 2px solid var(--ctl-active); outline-offset: 2px;
  }

  /* ── 원형 테마 버튼: Quarto 기본 토글의 동작은 그대로, 모양만 변경 ── */
  .navbar .quarto-color-scheme-toggle.theme-circle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 46px; height: 46px; padding: 0 !important; margin: 0;
    border-radius: 50%;
    background: var(--ctl-surface);
    border: 1px solid var(--ctl-border);
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
    font-size: 23px; line-height: 1;
    text-decoration: none !important;
  }
  .navbar .quarto-color-scheme-toggle.theme-circle i { display: none; }
  .navbar .quarto-color-scheme-toggle.theme-circle::before { content: "🌙"; }
  .navbar .quarto-color-scheme-toggle.theme-circle.alternate::before { content: "☀️"; }

  /* ── 모바일 축소 ── */
  @media (max-width: 575.98px) {
    .site-controls { gap: 10px; margin-right: 6px; }
    .lang-switch { height: 40px; padding: 4px; }
    .lang-switch a { min-width: 32px; height: 32px; padding: 0 9px; font-size: 13px; }
    .navbar .quarto-color-scheme-toggle.theme-circle { width: 40px; height: 40px; font-size: 20px; }
  }
</style>

<script>
(function () {
  /* 번역 완료 페이지의 KO 사이드바는 _quarto.yml(sidebar id: ko)에서 관리한다.
     여기서는 URL 매핑(chapters/... ↔ ko/chapters/...)과 UI 삽입만 담당한다. */
  /* ★ 한국어 번역이 완료된 페이지 목록 (사이트 루트 기준 상대 경로, .html).
     _quarto.yml의 sidebar id: ko 항목과 함께 갱신하세요. */
  const KO_READY = [
    "index.html",
    "chapters/part1/W1_intro.html",
    "chapters/part1/W2_rbasics.html",
    "chapters/part1/W3_wrangling.html",
    "chapters/part1/W4_publicdb.html",
    "chapters/part2/W5_QC.html",
    "chapters/part2/W6_EDA.html",
    "chapters/part2/W7_DEG Analysis.html",   // 파일명의 공백은 그대로 (URL 인코딩은 코드에서 처리)
    "chapters/part3/W8_DEG Results Processing.html",
    "chapters/part3/W9_ORA.html",
    "chapters/part3/W10_GSEA.html",
    "chapters/part4/W11_Rscript_vibe_coding.html",
    "chapters/part4/W12_summary.html",
  ];

  const NAV_KO = [                     // KO 페이지에서 navbar 왼쪽 라벨/링크 현지화
    { match: /(^|\/)index\.html$/,  text: "홈" },
    { match: /W1_intro\.html$/,      text: "1. 소개와 R 기초" },
    { match: /W5_QC\.html$/,         text: "2. DEG 분석" },
    { match: /W8_DEG/,               text: "3. 결과 해석" },
    { match: /W11_Rscript/,          text: "4. 실습과 마무리" },
  ];

  function siteRoot() {
    // Quarto가 삽입한 site_libs 상대경로에서 사이트 루트를 역산 (로컬 preview·GitHub Pages 모두 대응)
    const el = document.querySelector('link[href*="site_libs/"], script[src*="site_libs/"]');
    const attr = el ? (el.getAttribute("href") || el.getAttribute("src")) : null;
    if (attr) {
      const abs = new URL(attr, location.href).pathname;
      return abs.slice(0, abs.indexOf("site_libs/"));
    }
    return "/";
  }

  const dec = (p) => { try { return decodeURIComponent(p); } catch (_) { return p; } };

  function init() {
    const root = siteRoot();
    let rel = location.pathname.startsWith(root) ? location.pathname.slice(root.length) : location.pathname.replace(/^\//, "");
    if (rel === "" || rel.endsWith("/")) rel += "index.html";
    const isKo = /^ko\//.test(rel);
    const enRel = isKo ? rel.replace(/^ko\//, "") : rel;
    const koRel = "ko/" + enRel;
    const enHref = root + enRel + location.hash;
    const koHref = root + koRel + location.hash;

    /* ── 캡슐 생성 ── */
    const wrap = document.createElement("div");
    wrap.className = "site-controls";
    const cap = document.createElement("div");
    cap.className = "lang-switch";
    cap.setAttribute("role", "group");
    cap.setAttribute("aria-label", "Language / 언어");
    const mk = (label, href, active, aria) => {
      const a = document.createElement("a");
      a.textContent = label; a.href = href; a.setAttribute("aria-label", aria);
      if (active) { a.classList.add("active"); a.setAttribute("aria-current", "true"); }
      return a;
    };
    const aEn = mk("EN", enHref, !isKo, "English");
    const aKo = mk("KO", koHref, isKo, "한국어");
    cap.append(aEn, aKo);
    wrap.appendChild(cap);

    /* ── Quarto 테마 토글을 원형 버튼으로 재배치 ── */
    const toggle = document.querySelector(".navbar .quarto-color-scheme-toggle");
    if (toggle) {
      const li = toggle.closest("li");
      toggle.classList.add("theme-circle");
      toggle.setAttribute("aria-label", isKo ? "라이트/다크 모드 전환" : "Toggle light/dark mode");
      toggle.setAttribute("title", isKo ? "라이트/다크 모드" : "Light/dark mode");
      toggle.setAttribute("role", "button");
      wrap.appendChild(toggle);
      if (li && li.children.length === 0) li.remove();
    }

    const container = document.querySelector(".navbar .navbar-container, .navbar > .container-fluid");
    if (container) container.appendChild(wrap);   // 위치는 CSS order로 결정

    /* ── 아직 번역되지 않은 페이지: KO 버튼을 한국어 홈으로 연결하고 '준비 중'으로 표시 ── */
    if (!isKo && !KO_READY.includes(dec(enRel))) {
      aKo.href = root + "ko/index.html";
      aKo.classList.add("pending");
      aKo.title = "이 페이지의 한국어 번역은 준비 중입니다 — 한국어 홈으로 이동";
    }

    /* ── KO 페이지: navbar 왼쪽 메뉴 라벨·링크 현지화 ──
       Quarto의 내비게이션 스크립트가 나중에 href를 절대경로로 바꾸므로
       data-original-href를 우선 사용하고, 로드 후 한 번 더 적용한다. */
    if (isKo) {
      const normalize = (a) => {
        const raw = a.getAttribute("data-original-href") || a.getAttribute("href") || "";
        let path;
        try { path = new URL(raw, location.href).pathname; } catch (_) { return ""; }
        if (path.endsWith("/")) path += "index.html";
        return path;
      };
      const koLinks = new Set(KO_READY.map((r) => root + "ko/" + r));

      const localizeNav = () => {
        document.querySelectorAll(".navbar .navbar-nav .nav-link").forEach((a) => {
          if (a.classList.contains("quarto-color-scheme-toggle")) return;
          const path = normalize(a);
          if (!path) return;
          for (const m of NAV_KO) {
            if (m.match.test(path)) {
              const span = a.querySelector(".menu-text");
              (span || a).textContent = m.text;
              break;
            }
          }
          // 대응하는 KO 페이지가 있으면 링크도 ko/로 바꾼다
          if (!path.startsWith(root)) return;
          const rest = path.slice(root.length);
          if (rest.startsWith("ko/")) return;
          if (koLinks.has(root + "ko/" + dec(rest))) a.setAttribute("href", root + "ko/" + rest);
        });
      };
      localizeNav();
      window.addEventListener("load", localizeNav);
      setTimeout(localizeNav, 400);
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
